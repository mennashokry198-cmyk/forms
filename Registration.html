<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px 12px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            max-width: 720px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border: 1px solid #bbb;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #e8e8e8;
            text-align: center;
        }
        td:first-child {
            width: 30%;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="password"],
        input[type="tel"], input[type="number"], input[type="date"], select, textarea {
            width: 95%;
            padding: 7px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
        }
        .buttons {
            text-align: center;
        }
        button {
            padding: 9px 22px;
            margin: 5px;
            cursor: pointer;
        }
        .terms {
            font-weight: normal;
        }
        @media (max-width: 520px) {
            form { padding: 10px; }
            th, td { padding: 7px; }
            td:first-child { width: 38%; }
        }
    </style>
</head>
<body>
    <h1>Registration</h1>

    <form action="Thankyou.html" method="get" enctype="multipart/form-data">
        <!-- Hidden User ID field -->
        <input type="hidden" name="userId" value="1001">

        <table>
            <tr>
                <th colspan="2">Personal Information</th>
            </tr>
            <tr>
                <td><label for="firstName">First Name</label></td>
                <td><input type="text" id="firstName" name="firstName"
                    pattern="[A-Za-z]+" title="Enter letters only." required></td>
            </tr>
            <tr>
                <td><label for="lastName">Last Name</label></td>
                <td><input type="text" id="lastName" name="lastName"
                    pattern="[A-Za-z]+" title="Enter letters only." required></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td>
                    <input type="password" id="password" name="password"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                        title="At least 8 characters, including uppercase, lowercase, number and special character."
                        required>
                </td>
            </tr>
            <tr>
                <td><label for="repeatPassword">Repeat Password</label></td>
                <td>
                    <input type="password" id="repeatPassword" name="repeatPassword"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                        title="Enter a password with at least 8 characters, uppercase, lowercase, number and special character."
                        required>
                </td>
            </tr>
            <tr>
                <td><label for="picture">User Picture</label></td>
                <td><input type="file" id="picture" name="picture" accept="image/*"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </td>
            </tr>
            <tr>
                <td><label for="faculty">Faculty</label></td>
                <td>
                    <select id="faculty" name="faculty" required>
                        <option value="">-- Select Faculty --</option>
                        <option>Computers and Information</option>
                        <option>Engineering</option>
                        <option>Science</option>
                        <option>Commerce</option>
                        <option>Arts</option>
                        <option>Medicine</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Interests</td>
                <td>
                    <label><input type="checkbox" name="interests" value="Swimming"> Swimming</label><br>
                    <label><input type="checkbox" name="interests" value="Reading"> Reading</label><br>
                    <label><input type="checkbox" name="interests" value="Programming"> Programming</label><br>
                    <label><input type="checkbox" name="interests" value="Music"> Music</label>
                </td>
            </tr>
            <tr>
                <td><label for="about">About You</label></td>
                <td><textarea id="about" name="about" rows="4"></textarea></td>
            </tr>
            <tr>
                <td><label for="phone">Phone Number</label></td>
                <td>
                    <input type="tel" id="phone" name="phone"
                        pattern="01[0125][0-9]{8}"
                        title="Enter an 11-digit Egyptian mobile number starting with 010, 011, 012 or 015."
                        required>
                </td>
            </tr>
            <tr>
                <td><label for="gpa">GPA</label></td>
                <td><input type="number" id="gpa" name="gpa"
                    min="0" max="4" step="0.1" required></td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td><input type="date" id="dob" name="dob"></td>
            </tr>
            <tr>
                <td colspan="2" class="terms">
                    <label>
                        <input type="checkbox" name="agreement" required>
                        I agreed to the
                    </label>
                    <a href="Terms.html" target="_blank" rel="noopener">terms and conditions</a>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
